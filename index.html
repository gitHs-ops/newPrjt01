<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#eef2ff">
<title>새로운 프로젝트</title>
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-gradient: linear-gradient(140deg, #eef2ff 0%, #f8fafc 45%, #ecfeff 100%);
        --card-bg: rgba(255, 255, 255, 0.62);
        --card-border: rgba(255, 255, 255, 0.85);
        --text-primary: #0f172a;
        --text-secondary: #64748b;
        --accent-primary: #6366f1;
        --accent-secondary: #4f46e5;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        color-scheme: light;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        transition: background-color .25s ease, border-color .25s ease,
                    color .25s ease, box-shadow .25s ease, transform .25s var(--ease);
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Pretendard', -apple-system, sans-serif;
        background: var(--bg-gradient);
        background-attachment: fixed;
        position: relative;
        overflow-x: hidden;
    }

    body::before, body::after {
        content: '';
        position: fixed;
        width: 46vmax; height: 46vmax;
        border-radius: 50%;
        filter: blur(90px);
        opacity: .55;
        z-index: 0;
        pointer-events: none;
        animation: float 14s ease-in-out infinite alternate;
    }
    body::before { background: radial-gradient(circle, #c7d2fe 0%, transparent 70%); top: -14vmax; left: -12vmax; }
    body::after  { background: radial-gradient(circle, #a5f3fc 0%, transparent 70%); bottom: -16vmax; right: -12vmax; animation-delay: -7s; }

    @keyframes float {
        from { transform: translate3d(0,0,0) scale(1); }
        to   { transform: translate3d(2vmax,3vmax,0) scale(1.08); }
    }

    .card {
        position: relative;
        z-index: 1;
        background: var(--card-bg);
        backdrop-filter: blur(22px) saturate(160%);
        -webkit-backdrop-filter: blur(22px) saturate(160%);
        border: 1px solid var(--card-border);
        border-radius: 22px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, .10),
                    inset 0 1px 0 rgba(255, 255, 255, .75);
        padding: 56px 64px;
        text-align: center;
        animation: rise .6s var(--ease) both;
    }

    @keyframes rise {
        from { opacity: 0; transform: translateY(14px) scale(.985); }
        to   { opacity: 1; transform: none; }
    }

    .badge {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent-primary);
        margin-bottom: 20px;
        animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: .4; transform: scale(1.3); }
    }

    h1 {
        font-size: clamp(1.6rem, 4vw, 2.4rem);
        font-weight: 800;
        letter-spacing: -0.3px;
        color: var(--text-primary);
    }

    p {
        margin-top: 12px;
        font-family: var(--font-accent, 'Outfit', sans-serif);
        font-size: 0.95rem;
        color: var(--text-secondary);
    }

    @media (prefers-reduced-motion: reduce) {
        *, body::before, body::after {
            animation: none !important;
            transition-duration: .01ms !important;
        }
    }
</style>
</head>
<body>
    <div class="card">
        <span class="badge"></span>
        <h1>새로운 프로젝트 작업중입니다</h1>
        <p>Coming soon</p>
        <p style="margin-top:22px">
            <a href="login.html" style="display:inline-block;padding:12px 26px;font-weight:700;
               font-size:15px;color:#fff;text-decoration:none;border-radius:13px;
               background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));
               box-shadow:0 8px 20px rgba(99,102,241,.30)">로그인 데모 열기</a>
        </p>
    </div>
</body>
</html>
