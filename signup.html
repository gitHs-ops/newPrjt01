<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#eef2ff">
<title>회원가입 — newPrjt01</title>
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/auth.css">
</head>
<body>

<main class="container wide">
    <div class="brand">
        <span class="logo">📝</span>
        <h1>회원가입</h1>
        <p>아이디와 비밀번호를 정하면 바로 시작할 수 있어요</p>
    </div>

    <div id="banner" class="banner" role="alert"></div>

    <form id="signupForm" novalidate>
        <div class="field">
            <label for="signupId">아이디</label>
            <div class="input-wrap">
                <input type="text" id="signupId" placeholder="영문·숫자·_ 4~20자"
                       autocomplete="username" autocapitalize="off" spellcheck="false" required>
                <button type="button" class="btn-inline" id="checkIdBtn">중복확인</button>
            </div>
            <span class="hint" id="idHint"></span>
        </div>

        <div class="field">
            <label for="signupPw">비밀번호</label>
            <div class="input-wrap has-toggle">
                <input type="password" id="signupPw" placeholder="영문+숫자 8자 이상"
                       autocomplete="new-password" required>
                <button type="button" class="toggle-pw" id="togglePw"
                        aria-label="비밀번호 표시">👁️</button>
            </div>
            <span class="hint" id="pwHint"></span>
        </div>

        <div class="field">
            <label for="signupPw2">비밀번호 확인</label>
            <div class="input-wrap has-toggle">
                <input type="password" id="signupPw2" placeholder="위와 동일하게 다시 입력"
                       autocomplete="new-password" required>
                <button type="button" class="toggle-pw" id="togglePw2"
                        aria-label="비밀번호 표시">👁️</button>
            </div>
            <span class="hint" id="pw2Hint"></span>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn" style="margin-top:6px">가입하기</button>
    </form>

    <p class="foot">이미 계정이 있으신가요? <a href="login.html">로그인하기</a></p>

    <div class="demo-note">
        <b>데모 안내</b> · 가입 정보는 이 브라우저의 localStorage(<code>np_users</code>)에만 저장됩니다.
        비밀번호는 <b>평문이 아니라</b> PBKDF2-SHA256(10만회) + 사용자별 랜덤 솔트로 해시해 보관합니다.
        다른 기기·브라우저에서는 보이지 않습니다.
    </div>
</main>

<script src="assets/auth.js"></script>
<script>
(function () {
    'use strict';

    var banner     = document.getElementById('banner');
    var form       = document.getElementById('signupForm');
    var idInput    = document.getElementById('signupId');
    var pwInput    = document.getElementById('signupPw');
    var pw2Input   = document.getElementById('signupPw2');
    var idHint     = document.getElementById('idHint');
    var pwHint     = document.getElementById('pwHint');
    var pw2Hint    = document.getElementById('pw2Hint');
    var checkIdBtn = document.getElementById('checkIdBtn');
    var submitBtn  = document.getElementById('submitBtn');

    /* 중복확인을 통과한 아이디. 아이디를 다시 고치면 무효가 된다. */
    var verifiedId = null;

    function show(msg, kind) {
        banner.textContent = msg;
        banner.className = 'banner show ' + (kind || 'error');
    }
    function hide() { banner.className = 'banner'; banner.textContent = ''; }

    function setHint(el, msg, kind) {
        el.textContent = msg || '';
        el.className = 'hint' + (kind ? ' ' + kind : '');
    }

    if (!Auth.cryptoAvailable()) {
        show('file:// 로 직접 열면 가입이 동작하지 않습니다. init.ps1 로 서버를 띄운 뒤 ' +
             'http://localhost:8940/signup.html 로 접속하세요.', 'warn');
        submitBtn.disabled = true;
        checkIdBtn.disabled = true;
    }

    /* ---------- 비밀번호 보기/숨김 ---------- */
    function bindToggle(btnId, input) {
        document.getElementById(btnId).addEventListener('click', function () {
            var showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            this.textContent = showing ? '👁️' : '🙈';
            this.setAttribute('aria-label', showing ? '비밀번호 표시' : '비밀번호 숨기기');
            input.focus();
        });
    }
    bindToggle('togglePw', pwInput);
    bindToggle('togglePw2', pw2Input);

    /* ---------- 아이디 중복확인 ---------- */
    function runIdCheck() {
        hide();
        var v = idInput.value.trim();
        var err = Auth.validateId(v);
        if (err) { verifiedId = null; setHint(idHint, err, 'error'); idInput.focus(); return; }

        if (Auth.isIdTaken(v)) {
            verifiedId = null;
            setHint(idHint, '이미 사용 중인 아이디입니다.', 'error');
        } else {
            verifiedId = v.toLowerCase();
            setHint(idHint, '‘' + v + '’ 사용 가능합니다.', 'ok');
        }
    }

    checkIdBtn.addEventListener('click', runIdCheck);

    /* 아이디 칸에서 Enter → 중복확인 (폼이 제출되지 않도록 막는다) */
    idInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); runIdCheck(); }
    });

    /* 아이디를 고치면 이전 중복확인 결과를 무효화 */
    idInput.addEventListener('input', function () {
        var v = idInput.value.trim().toLowerCase();
        if (verifiedId && v !== verifiedId) {
            verifiedId = null;
            setHint(idHint, '아이디가 변경되었습니다. 중복확인을 다시 눌러주세요.', 'warn');
        } else if (!verifiedId) {
            setHint(idHint, '');
        }
    });

    /* ---------- 비밀번호 검증 ---------- */
    pwInput.addEventListener('input', function () {
        if (!pwInput.value) { setHint(pwHint, ''); checkMatch(); return; }
        var err = Auth.validatePassword(pwInput.value);
        setHint(pwHint, err || '사용 가능한 비밀번호입니다.', err ? 'error' : 'ok');
        checkMatch();
    });

    function checkMatch() {
        if (!pw2Input.value) { setHint(pw2Hint, ''); return; }
        if (pwInput.value === pw2Input.value) {
            setHint(pw2Hint, '비밀번호가 일치합니다.', 'ok');
        } else {
            setHint(pw2Hint, '비밀번호가 일치하지 않습니다.', 'error');
        }
    }
    pw2Input.addEventListener('input', checkMatch);

    /* ---------- 제출 ---------- */
    form.addEventListener('submit', function (e) {
        e.preventDefault();
        hide();

        var id = idInput.value.trim();

        var idErr = Auth.validateId(id);
        if (idErr) { setHint(idHint, idErr, 'error'); idInput.focus(); return; }

        if (verifiedId !== id.toLowerCase()) {
            setHint(idHint, '아이디 중복확인을 먼저 해주세요.', 'error');
            checkIdBtn.focus();
            return;
        }

        var pwErr = Auth.validatePassword(pwInput.value);
        if (pwErr) { setHint(pwHint, pwErr, 'error'); pwInput.focus(); return; }

        if (pwInput.value !== pw2Input.value) {
            setHint(pw2Hint, '비밀번호가 일치하지 않습니다.', 'error');
            pw2Input.focus();
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = '가입 처리 중…';

        Auth.signup(id, pwInput.value)
            .then(function (u) {
                location.href = 'login.html?signup=' + encodeURIComponent(u.id);
            })
            .catch(function (err) {
                submitBtn.disabled = false;
                submitBtn.textContent = '가입하기';
                show(err.message, 'error');
            });
    });

    idInput.focus();
})();
</script>
</body>
</html>
