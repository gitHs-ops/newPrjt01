<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="theme-color" content="#eef2ff"><title>ログイン · APLink</title><link rel="stylesheet" href="/styles.css"></head>
<body class="login-page"><main class="login-card glass"><p>APLink Business Platform</p><h1>ログイン</h1><p>ユーザー名とパスワードを入力してください。</p><form id="login-form"><label>ユーザー名<input name="user" autocomplete="username" required maxlength="128" autofocus></label><label>パスワード<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label><p id="login-error" role="alert"></p><button type="submit" class="primary">ログイン</button></form></main><script src="/login.js" defer></script></body></html>
