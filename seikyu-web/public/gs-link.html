<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GS-LINK 物流管理システム</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
:root{
  --teal-900:#064b4e; --teal-700:#086266; --teal-500:#179a9b; --teal-300:#5fc4c2; --teal-100:#9adcda;
  --grad:linear-gradient(135deg,#086266 0%,#179a9b 55%,#9adcda 100%);
  --gold:#c9a227; --gold-soft:#f3e3ad;
  --bg:#f3f6f6; --card:#ffffff; --line:#dfe7e7; --ink:#15302f; --muted:#6c8382;
  --danger:#c0392b; --radius:14px; --shadow:0 2px 10px rgba(8,98,102,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Noto Sans JP','Hiragino Sans',sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}

/* ===== header ===== */
header{background:var(--grad);color:#fff;padding:0 20px;height:58px;display:flex;align-items:center;
  justify-content:space-between;box-shadow:0 2px 12px rgba(6,75,78,.25);position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand .mark{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:-.5px}
.brand b{font-size:19px;letter-spacing:.5px;font-weight:800}
.brand span{font-size:11px;opacity:.85;border-left:1px solid rgba(255,255,255,.4);padding-left:10px;margin-left:2px}
.hdr-right{display:flex;align-items:center;gap:14px;font-size:12.5px}
.hdr-right .user{display:flex;align-items:center;gap:7px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#3a2d00;display:grid;place-items:center;
  font-weight:700;font-size:12px}
.icon-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:8px;
  width:32px;height:32px;cursor:pointer;display:grid;place-items:center}
.icon-btn:hover{background:rgba(255,255,255,.26)}

/* ===== breadcrumb ===== */
.crumb{background:#fff;border-bottom:1px solid var(--line);padding:9px 22px;font-size:12.5px;color:var(--muted);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crumb a:hover{color:var(--teal-700);text-decoration:underline}
.crumb .sep{opacity:.45}
.crumb .now{color:var(--ink);font-weight:600}

main{max-width:1180px;margin:0 auto;padding:24px 20px 60px}

/* ===== top menu ===== */
.hero{background:var(--grad);border-radius:18px;padding:26px 28px;color:#fff;margin-bottom:22px;
  display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:240px;height:240px;border-radius:50%;
  background:rgba(255,255,255,.08)}
.hero h1{margin:0 0 6px;font-size:22px;font-weight:800;letter-spacing:-.3px}
.hero p{margin:0;font-size:13px;opacity:.9}
.hero .kpis{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.kpi{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);border-radius:12px;padding:10px 14px;min-width:104px}
.kpi small{display:block;font-size:11px;opacity:.85}
.kpi b{font-size:19px;font-weight:800}
.kpi b i{font-size:11px;font-style:normal;opacity:.8;font-weight:600;margin-left:2px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 18px 18px;
  cursor:pointer;position:relative;transition:.16s;box-shadow:var(--shadow);text-align:center}
.tile:hover{transform:translateY(-3px);border-color:var(--teal-300);box-shadow:0 10px 24px rgba(8,98,102,.16)}
.tile .no{position:absolute;left:14px;top:10px;font-size:13px;font-weight:800;color:#e3eceb;letter-spacing:1px}
.tile:hover .no{color:var(--gold-soft)}
.tile .ico{font-size:30px;line-height:1;margin:10px 0 12px;filter:saturate(1.1)}
.tile .nm{font-weight:700;font-size:15px}
.tile .desc{font-size:11.5px;color:var(--muted);margin-top:5px}
.tile .bar{height:3px;border-radius:3px;background:var(--grad);width:38px;margin:12px auto 0;opacity:.75}

/* ===== submenu ===== */
.sub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.sub{background:#fff;border:1px solid var(--line);border-left:4px solid var(--teal-500);border-radius:10px;
  padding:14px 16px;cursor:pointer;transition:.14s;box-shadow:var(--shadow)}
.sub:hover{border-left-color:var(--gold);transform:translateX(3px)}
.sub b{display:block;font-size:14px}
.sub small{color:var(--muted);font-size:11.5px}

/* ===== page head ===== */
.page-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{margin:0;font-size:19px;font-weight:800;display:flex;align-items:center;gap:9px}
.page-head h2::before{content:"";width:5px;height:20px;border-radius:3px;background:var(--grad)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}

/* ===== buttons ===== */
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 15px;cursor:pointer;font-size:13px;
  font-weight:600;transition:.14s;white-space:nowrap}
.btn:hover{border-color:var(--teal-500);color:var(--teal-700)}
.btn.primary{background:var(--grad);color:#fff;border:none;box-shadow:0 2px 8px rgba(8,98,102,.3)}
.btn.primary:hover{filter:brightness(1.07);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3a2d00}
.btn.gold:hover{filter:brightness(1.06);color:#3a2d00}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:7px}
.btn.danger{color:var(--danger);border-color:#f0c9c4}
.btn.danger:hover{background:#fdf1ef;border-color:var(--danger)}

/* ===== panel / search ===== */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.panel-h{padding:11px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:13.5px;
  display:flex;justify-content:space-between;align-items:center;background:#fafcfc;border-radius:var(--radius) var(--radius) 0 0}
.panel-b{padding:16px}
.search{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fld label{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--teal-500);box-shadow:0 0 0 3px rgba(23,154,155,.13)}
.fld.req label::after{content:" *";color:var(--danger)}

/* ===== table ===== */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:680px}
thead th{background:#eef5f4;color:var(--teal-900);text-align:left;padding:10px 12px;font-weight:700;font-size:12px;
  white-space:nowrap;border-bottom:2px solid var(--teal-300)}
tbody td{padding:9px 12px;border-bottom:1px solid #eef2f2;white-space:nowrap}
tbody tr:hover{background:#f6fbfb}
tbody tr.sel{background:#eaf7f6}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:38px;text-align:center;color:var(--muted)}

.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid}
.t-wait{color:#8a6d00;background:#fdf6df;border-color:#f0e0a8}
.t-ship{color:#0d6e55;background:#e6f6f0;border-color:#b6e3d4}
.t-done{color:#265fa8;background:#e8f1fb;border-color:#c2daf4}
.t-cancel{color:#8a4a44;background:#fbeeec;border-color:#f0cbc5}

/* ===== pager ===== */
.pager{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--muted);flex-wrap:wrap;gap:10px}
.pager .pages{display:flex;gap:5px}
.pager .pg{min-width:29px;height:29px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;font-size:12.5px}
.pager .pg.on{background:var(--teal-700);color:#fff;border-color:var(--teal-700);font-weight:700}

/* ===== modal ===== */
.mask{position:fixed;inset:0;background:rgba(10,40,40,.45);display:grid;place-items:center;z-index:100;padding:18px}
.modal{background:#fff;border-radius:16px;width:min(720px,100%);max-height:88vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.28)}
.modal-h{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
  background:var(--grad);color:#fff;border-radius:16px 16px 0 0;position:sticky;top:0}
.modal-h b{font-size:15.5px}
.modal-b{padding:20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;background:#fafcfc}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}

/* ===== misc ===== */
.toast{position:fixed;right:20px;bottom:22px;background:var(--teal-900);color:#fff;padding:12px 18px;border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:200;font-size:13px;border-left:4px solid var(--gold)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);
  border-top:3px solid var(--teal-500)}
.stat small{color:var(--muted);font-size:11.5px;font-weight:600}
.stat b{display:block;font-size:22px;font-weight:800;margin-top:3px}
.stat b i{font-size:12px;font-style:normal;color:var(--muted);font-weight:600;margin-left:3px}
.bars{display:flex;align-items:flex-end;gap:12px;height:170px;padding:10px 4px 0}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b .v{width:100%;max-width:52px;border-radius:7px 7px 0 0;background:var(--grad);min-height:4px;transition:.5s}
.bars .b .l{font-size:11px;color:var(--muted)}
.bars .b .n{font-size:11px;font-weight:700;color:var(--teal-700)}
.note{font-size:12px;color:var(--muted);background:#fafcfc;border:1px dashed var(--line);border-radius:10px;padding:12px 14px}
footer{text-align:center;color:var(--muted);font-size:11.5px;padding:18px}
@media(max-width:640px){
  .form-grid{grid-template-columns:1fr}
  header{padding:0 12px}.brand span{display:none}
  main{padding:16px 12px 50px}
}
</style>
</head>

/* ================= ルーター ================= */
let route = {view:'top'};
function go(h){location.hash=h}
window.addEventListener('hashchange',render);

function parse(){
  const h=location.hash.replace(/^#\/?/,'');
  if(!h) return {view:'top'};
  const [a,b]=h.split('/');
  if(a==='m') return {view:'module',mod:b};
  if(a==='s') return {view:'screen',sc:b};
  return {view:'top'};
}

/* ================= 描画 ================= */
function render(){
  route=parse();
  const app=document.getElementById('app');
  if(route.view==='top'){crumbs([]);app.innerHTML=viewTop();}
  else if(route.view==='module'){
    const m=MODULES.find(x=>x.id===route.mod); if(!m) return go('#/');
    crumbs([{t:m.nm}]); app.innerHTML=viewModule(m);
  } else {
    const id=route.sc;
    const m=MODULES.find(x=>x.subs.some(s=>s.id===id));
    const sub=m&&m.subs.find(s=>s.id===id);
    if(!m) return go('#/');
    crumbs([{t:m.nm,h:'#/m/'+m.id},{t:sub.nm}]);
    app.innerHTML = SCREENS[id] ? viewList(id) : viewSpecial(id,m,sub);
    if(SCREENS[id]) bindList(id);
    if(id==='shukka-stat'||id==='dump-stat'||id==='uriage-stat') animBars();
  }
  window.scrollTo(0,0);
}
function crumbs(arr){
  const c=document.getElementById('crumb');
  let h=`<a href="#/">🏠 トップメニュー</a>`;
  arr.forEach(x=>{h+=`<span class="sep">›</span>`+(x.h?`<a href="${x.h}">${x.t}</a>`:`<span class="now">${x.t}</span>`)});
  c.innerHTML=h;
}

      <div class="tile" onclick="go('#/m/${m.id}')">

/* ---------- 共通一覧画面 ---------- */
const PAGE=6;
let listState={};
function viewList(id){
  const S=SCREENS[id];
  listState[id]=listState[id]||{q:{},page:1,sel:null};
  return `
  <div class="page-head">
    <h2>${S.title}</h2>
    <div class="toolbar">
      ${S.readonly?'':`<button class="btn primary" onclick="openForm('${id}')">＋ 新規登録</button>`}
      <button class="btn" onclick="exportCsv('${id}')">⬇ CSV出力</button>
      <button class="btn ghost" onclick="go('#/m/${S.mod}')">← 戻る</button>
    </div>
  </div>
  <div class="panel">
    <div class="panel-h">検索条件</div>
    <div class="panel-b">
      <div class="search">
        ${S.search.map(f=>`<div class="fld"><label>${f.l}</label>${
          f.opt?`<select data-q="${f.k}">${f.opt.map(o=>`<option value="${o}">${o||'すべて'}</option>`).join('')}</select>`
               :`<input data-q="${f.k}" placeholder="部分一致">`}</div>`).join('')}
      </div>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button class="btn primary" onclick="doSearch('${id}')">🔍 検索</button>
        <button class="btn" onclick="resetSearch('${id}')">条件クリア</button>
      </div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-h"><span>検索結果</span><span id="cnt-${id}" style="font-weight:600;color:var(--muted)"></span></div>
    <div class="tbl-wrap" id="tbl-${id}"></div>
    <div class="pager" id="pgr-${id}"></div>
  </div>`;
}
function bindList(id){drawTable(id)}
function doSearch(id){
  const q={};document.querySelectorAll(`[data-q]`).forEach(e=>{if(e.value)q[e.dataset.q]=e.value});
  listState[id]={...listState[id],q,page:1};drawTable(id);
}
function resetSearch(id){document.querySelectorAll('[data-q]').forEach(e=>e.value='');listState[id]={q:{},page:1,sel:null};drawTable(id)}
function filtered(id){
  const S=SCREENS[id],st=listState[id];
  return DB[S.key].filter(r=>Object.entries(st.q).every(([k,v])=>String(r[k]??'').includes(v)));
}
function drawTable(id){
  const S=SCREENS[id],st=listState[id],rows=filtered(id);
  const tot=Math.max(1,Math.ceil(rows.length/PAGE));
  if(st.page>tot)st.page=tot;
  const page=rows.slice((st.page-1)*PAGE,st.page*PAGE);
  document.getElementById('cnt-'+id).textContent=`全 ${rows.length} 件`;
  document.getElementById('tbl-'+id).innerHTML = rows.length? `
    <table><thead><tr>${S.cols.map(c=>`<th class="${c.num?'num':''}">${c.l}</th>`).join('')}
    ${S.readonly?'':'<th>操作</th>'}</tr></thead><tbody>
    ${page.map(r=>`<tr>${S.cols.map(c=>`<td class="${c.num?'num':''}">${c.fmt?c.fmt(r[c.k]):(r[c.k]??'')}</td>`).join('')}
      ${S.readonly?'':`<td><button class="btn sm" onclick="openForm('${id}','${r[S.idf]}')">修正</button>
       <button class="btn sm danger" onclick="delRow('${id}','${r[S.idf]}')">削除</button></td>`}</tr>`).join('')}
    </tbody></table>`:`<div class="empty">該当するデータがありません</div>`;
  let pg='';for(let i=1;i<=tot;i++)pg+=`<button class="pg ${i===st.page?'on':''}" onclick="setPage('${id}',${i})">${i}</button>`;
  document.getElementById('pgr-'+id).innerHTML=`<span>${st.page} / ${tot} ページ</span><div class="pages">${pg}</div>`;
}
function setPage(id,p){listState[id].page=p;drawTable(id)}
function delRow(id,key){
  const S=SCREENS[id];
  if(!confirm('選択したデータを削除します。よろしいですか？'))return;
  DB[S.key]=DB[S.key].filter(r=>r[S.idf]!==key);drawTable(id);toast('削除しました');
}
function exportCsv(id){
  const S=SCREENS[id],rows=filtered(id);
  const csv=[S.cols.map(c=>c.l).join(','),...rows.map(r=>S.cols.map(c=>r[c.k]).join(','))].join('\n');
  toast(`CSV ${rows.length} 件を出力しました（デモ）`);
  console.log(csv);
}

/* ---------- 入力フォーム ---------- */
let formCtx=null;
function openForm(id,key){
  const S=SCREENS[id];
  const rec=key?{...DB[S.key].find(r=>r[S.idf]===key)}:{};
  if(!key)S.form.forEach(f=>{if(f.auto)rec[f.k]=uid(f.auto);if(f.t==='date')rec[f.k]=d(0)});
  formCtx={id,key,rec};
  const srcOpt=(src)=>DB[src].map(x=>x.name||x.id);
  document.body.insertAdjacentHTML('beforeend',`
  <div class="mask" id="mask">
    <div class="modal">
      <div class="modal-h"><b>${S.title} ${key?'修正':'新規登録'}</b>
        <button class="icon-btn" onclick="closeForm()">✕</button></div>
      <div class="modal-b"><div class="form-grid">
        ${S.form.map(f=>{
          const v=rec[f.k]??'';
          const ro=(key&&f.req&&f.auto)||f.calc?'readonly':'';
          let el;
          if(f.t==='select'){
            const opts=f.opt||srcOpt(f.src);
            el=`<select data-f="${f.k}" onchange="recalc()">${opts.map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('')}</select>`;
          } else el=`<input data-f="${f.k}" type="${f.t||'text'}" value="${v}" ${ro} oninput="recalc()">`;
          return `<div class="fld ${f.req?'req':''} ${f.full?'full':''}"><label>${f.l}</label>${el}</div>`;
        }).join('')}
      </div></div>
      <div class="modal-f">
        <button class="btn" onclick="closeForm()">キャンセル</button>
        <button class="btn gold" onclick="saveForm()">💾 保存</button>
      </div>
    </div>
  </div>`);
  recalc();
}
function readForm(){const o={};document.querySelectorAll('[data-f]').forEach(e=>o[e.dataset.f]=e.value);return o}
function recalc(){
  if(!formCtx)return;const S=SCREENS[formCtx.id],f=readForm();
  S.form.filter(x=>x.calc).forEach(x=>{const el=document.querySelector(`[data-f="${x.k}"]`);if(el)el.value=x.calc(f)});
}
function closeForm(){const m=document.getElementById('mask');if(m)m.remove();formCtx=null}
function saveForm(){
  const {id,key}=formCtx,S=SCREENS[id],o=readForm();
  const miss=S.form.filter(f=>f.req&&!String(o[f.k]||'').trim());
  if(miss.length)return alert('必須項目が未入力です：'+miss.map(f=>f.l).join('、'));
  S.form.forEach(f=>{if(f.t==='number')o[f.k]=Number(o[f.k])||0});
  if(key){const i=DB[S.key].findIndex(r=>r[S.idf]===key);DB[S.key][i]={...DB[S.key][i],...o}}
  else{
    if(DB[S.key].some(r=>r[S.idf]===o[S.idf]))return alert('同じコードが既に登録されています。');
    DB[S.key].unshift(o);
  }
  closeForm();drawTable(id);toast(key?'修正しました':'登録しました');
}

/* ---------- 個別画面 ---------- */
function viewSpecial(id,m,sub){
  const head=(extra='')=>`
  <div class="page-head"><h2>${sub.nm}</h2>
    <div class="toolbar">${extra}<button class="btn ghost" onclick="go('#/m/${m.id}')">← 戻る</button></div></div>`;

  if(id==='shukka-plan'){
    const byVeh={};DB.shukka.filter(s=>['出荷待','予定','出荷済'].includes(s.status))
      .forEach(s=>{(byVeh[s.veh]=byVeh[s.veh]||[]).push(s)});
    return head()+`<div class="stat-row">
      ${DB.veh.map(v=>{const l=byVeh[v.id]||[];return `
        <div class="stat"><small>${v.id} / ${v.driver}</small><b>${l.length}<i>件</i></b>
        <div style="font-size:11.5px;color:var(--muted);margin-top:6px">${v.type} · ${tag(v.use)}</div></div>`}).join('')}
    </div>
    <div class="panel"><div class="panel-h">車両別 積載予定</div><div class="tbl-wrap">
      <table><thead><tr><th>車両</th><th>乗務員</th><th>出荷日</th><th>得意先</th><th>品名</th><th class="num">数量</th><th>納品先</th><th>状態</th></tr></thead>
      <tbody>${DB.shukka.filter(s=>s.status!=='キャンセル').map(s=>{const v=DB.veh.find(x=>x.id===s.veh)||{};
        return `<tr><td>${s.veh}</td><td>${v.driver||s.driver}</td><td>${s.date}</td><td>${s.cust}</td><td>${s.item}</td>
        <td class="num">${money(s.qty)} ${s.unit}</td><td>${s.dest}</td><td>${tag(s.status)}</td></tr>`}).join('')}
      </tbody></table></div></div>`;
  }
  if(id==='shukka-stat'){
    const map={};DB.shukka.forEach(s=>map[s.date]=(map[s.date]||0)+1);
    return head()+barPanel('日別 出荷件数',map,'件')+`<div class="note">※ デモデータに基づく集計です。実運用では期間指定・得意先別のドリルダウンを想定しています。</div>`;
  }
  if(id==='uriage-stat'){
    const map={};DB.uriage.forEach(s=>map[s.cust]=(map[s.cust]||0)+s.amount);
    const tot=Object.values(map).reduce((a,b)=>a+b,0);
    return head()+`<div class="stat-row">
      <div class="stat"><small>売上合計</small><b>${money(tot)}<i>円</i></b></div>
      <div class="stat"><small>伝票件数</small><b>${DB.uriage.length}<i>件</i></b></div>
      <div class="stat"><small>平均単価</small><b>${money(Math.round(tot/DB.uriage.length))}<i>円</i></b></div>
    </div>`+barPanel('得意先別 売上',map,'円');
  }
  if(id==='seikyu-close'){
    return head()+`<div class="panel"><div class="panel-h">締め処理</div><div class="panel-b">
      <div class="search">
        <div class="fld"><label>締め対象年月</label><input type="month" value="2026-11"></div>
        <div class="fld"><label>締日区分</label><select><option>すべて</option><option>末日</option><option>10日</option><option>20日</option></select></div>
        <div class="fld"><label>得意先</label><select><option>すべて</option>${DB.cust.map(c=>`<option>${c.name}</option>`).join('')}</select></div>
      </div>
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn primary" onclick="toast('締め処理を実行しました（対象 ${DB.uriage.length} 件 / デモ）')">▶ 締め処理実行</button>
        <button class="btn" onclick="toast('締め取消を実行しました（デモ）')">締め取消</button>
      </div>
      <div class="note" style="margin-top:16px">締め処理を実行すると、対象期間の売上伝票から請求データが自動生成されます（本プロトタイプでは実行結果のみ表示）。</div>
    </div></div>`;
  }
  if(id==='renkei-io'){
    return head()+`<div class="panel"><div class="panel-h">データ取込</div><div class="panel-b">
      <div class="search">
        <div class="fld"><label>連携種別</label><select><option>受注取込</option><option>在庫連携</option><option>会計連携</option></select></div>
        <div class="fld"><label>ファイル</label><input type="file"></div>
        <div class="fld"><label>文字コード</label><select><option>UTF-8</option><option>Shift_JIS</option><option>EUC-KR</option></select></div>
      </div>
      <div style="margin-top:14px"><button class="btn primary" onclick="toast('取込を実行しました（デモ）')">⬆ 取込実行</button></div>
    </div></div>
    <div class="panel"><div class="panel-h">データ出力</div><div class="panel-b">
      <div class="search">
        <div class="fld"><label>出力対象</label><select><option>出荷データ</option><option>売上データ</option><option>請求データ</option></select></div>
        <div class="fld"><label>期間（開始）</label><input type="date" value="${d(-30)}"></div>
        <div class="fld"><label>期間（終了）</label><input type="date" value="${d(0)}"></div>
      </div>
      <div style="margin-top:14px"><button class="btn gold" onclick="toast('CSV を出力しました（デモ）')">⬇ CSV出力</button></div>
    </div></div>`;
  }
  if(id==='sys-env'){
    const f=(l,v,t='text')=>`<div class="fld"><label>${l}</label><input type="${t}" value="${v}"></div>`;
    return head()+`<div class="panel"><div class="panel-h">会社情報</div><div class="panel-b"><div class="search">
      ${f('会社名','感性ソフトウェア')}${f('代表者','金 現洙')}${f('所在地','慶尚北道 浦項市')}
      ${f('電話番号','054-000-0000')}${f('事業者番号','000-00-00000')}
    </div></div></div>
    <div class="panel"><div class="panel-h">運用設定</div><div class="panel-b"><div class="search">
      ${f('消費税率（%）','10','number')}${f('端数処理','四捨五入')}${f('出荷番号採番','SH-####')}
      ${f('請求番号採番','IV-####')}${f('データ保持期間（年）','7','number')}
    </div>
    <div style="margin-top:14px"><button class="btn gold" onclick="toast('設定を保存しました（デモ）')">💾 設定保存</button></div>
    </div></div>`;
  }
  if(id==='dump-stat'){
    const map={};DB.dump.forEach(x=>map[x.date]=(map[x.date]||0)+x.ton);
    const tot=DB.dump.reduce((a,b)=>a+b.fee,0),ton=DB.dump.reduce((a,b)=>a+b.ton,0);
    return head()+`<div class="stat-row">
      <div class="stat"><small>総運搬量</small><b>${money(ton)}<i>t</i></b></div>
      <div class="stat"><small>総運賃</small><b>${money(tot)}<i>円</i></b></div>
      <div class="stat"><small>日報件数</small><b>${DB.dump.length}<i>件</i></b></div>
      <div class="stat"><small>平均単価</small><b>${money(Math.round(tot/ton))}<i>円/t</i></b></div>
    </div>`+barPanel('日別 運搬量',map,'t');
  }
  return head()+`<div class="note">この画面はプロトタイプ未実装です。</div>`;
}
function barPanel(title,map,unit){
  const keys=Object.keys(map).sort(),max=Math.max(...Object.values(map),1);
  return `<div class="panel"><div class="panel-h">${title}</div><div class="panel-b">
    <div class="bars">${keys.map(k=>`<div class="b">
      <div class="n">${money(map[k])}${unit}</div>
      <div class="v" data-h="${Math.round(map[k]/max*100)}" style="height:0"></div>
      <div class="l">${k.length>7?k.slice(5):k}</div></div>`).join('')}</div>
  </div></div>`;
}
function animBars(){requestAnimationFrame(()=>document.querySelectorAll('.bars .v').forEach(e=>e.style.height=e.dataset.h+'%'))}

/* ---------- toast ---------- */
let tt;
function toast(msg){
  document.querySelectorAll('.toast').forEach(e=>e.remove());
  const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);
  clearTimeout(tt);tt=setTimeout(()=>el.remove(),2600);
}
render();
</script>
