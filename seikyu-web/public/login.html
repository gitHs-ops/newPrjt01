<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#eef2ff">
<title>ログイン · APLink 請求・入金管理</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
<main class="login-card glass">
  <div class="brand"><span class="brand-mark">A</span><span><b>APLink</b><small>請求・入金管理システム</small></span></div>
  <h1>ログイン</h1>
  <p class="muted small">ログインIDとパスワードを入力してください。</p>
  <form id="login-form">
    <label class="field">ログインID<input name="loginId" autocomplete="username" required maxlength="64" autofocus></label>
    <label class="field">パスワード<input name="password" type="password" autocomplete="current-password" required maxlength="200"></label>
    <p id="login-error" role="alert"></p>
    <button type="submit" class="primary" style="justify-content:center">ログイン</button>
  </form>
  <p class="muted small" style="margin-top:16px">架空データによる検証環境です。</p>
</main>
<script src="/login.js" defer></script>
</body>
</html>
