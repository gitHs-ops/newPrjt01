services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APLINK_ADMIN_PASSWORD: ${APLINK_ADMIN_PASSWORD:?Set a password of at least 16 characters}
      DATABASE_URL: jdbc:postgresql://db:5432/seikyu
      DATABASE_USER: seikyu
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set a database password}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: seikyu
      POSTGRES_USER: seikyu
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set a database password}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seikyu"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres:
