spring.application.name=aplink-seikyu
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/seikyu;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
app.admin.username=${APLINK_ADMIN_USER:admin}
app.admin.password=${APLINK_ADMIN_PASSWORD:}
app.viewer.username=${APLINK_VIEWER_USER:viewer}
app.viewer.password=${APLINK_VIEWER_PASSWORD:}
